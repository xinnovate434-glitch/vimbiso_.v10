name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build FULL Vimbiso React UI
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: |
          set -e
          npx vite build --config vite.capacitor.config.ts
          if [ -f dist/capacitor.html ]; then
            mv dist/capacitor.html dist/index.html
          fi
          test -f dist/index.html
          mkdir -p dist/icons
          cp -f public/icons/* dist/icons/ 2>/dev/null || true
          du -sh dist

      - name: Capacitor Android
        run: |
          set -e
          npm install -D @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6
          printf '%s\n' '{"appId":"co.vimbiso.network","appName":"Vimbiso Network","webDir":"dist","server":{"androidScheme":"https"}}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Android permissions (safe)
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              print("no manifest — skip")
              raise SystemExit(0)

          t = p.read_text()
          perms = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.RECORD_AUDIO",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          ]

          # Only add missing permissions; insert ONLY after full <manifest ...> tag
          m = re.search(r"<manifest\b[^>]*>", t, flags=re.DOTALL)
          if not m:
              print("manifest tag not found — skip perms")
              raise SystemExit(0)

          missing = [perm for perm in perms if perm not in t]
          if not missing:
              print("all permissions already present")
              raise SystemExit(0)

          block = "\n".join(
              f'    <uses-permission android:name="{perm}" />' for perm in missing
          )
          t = t[: m.end()] + "\n" + block + "\n" + t[m.end() :]
          p.write_text(t)

          # Sanity: application tag still present and manifest well-formed enough
          if "<application" not in t or t.count("<manifest") != 1:
              raise SystemExit("manifest looks broken after patch")
          print("added:", ", ".join(missing))
          PY

      - name: Apply app icon
        run: |
          set -e
          if [ -d android-icons ]; then
            for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              src="android-icons/mipmap-$dens"
              dst="android/app/src/main/res/mipmap-$dens"
              mkdir -p "$dst"
              if [ -d "$src" ]; then
                cp -f "$src"/*.png "$dst/" || true
              fi
            done
            echo "App icons applied"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle assembleDebug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vimbiso-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
