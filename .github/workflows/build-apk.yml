name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci || npm install

      - name: Build FULL Vimbiso React UI
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_AUTH_ENABLED: "true"
        run: |
          set -e
          npx vite build --config vite.capacitor.config.ts
          if [ -f dist/capacitor.html ]; then
            mv dist/capacitor.html dist/index.html
          fi
          test -f dist/index.html
          ls -la dist | head -25
          du -sh dist
          # ensure images present
          find dist -name 'bg-welcome.jpg' | head -3
          find dist -name '*.jpg' | wc -l

      - name: Capacitor Android
        run: |
          set -e
          npm install -D @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6
          printf '%s\n' '{"appId":"co.vimbiso.network","appName":"Vimbiso Network","webDir":"dist","server":{"androidScheme":"https"},"android":{"allowMixedContent":true}}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: vimbiso-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
