name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare Vimbiso web UI
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: |
          set -e
          mkdir -p dist
          cp -r mobile-www/* dist/
          python3 - <<'PY'
          import os, json, pathlib
          cfg = {
            "supabaseUrl": os.environ.get("VITE_SUPABASE_URL") or "",
            "supabaseAnon": os.environ.get("VITE_SUPABASE_ANON_KEY") or "",
            "geminiKey": os.environ.get("VITE_GEMINI_API_KEY") or "",
          }
          pathlib.Path("dist/config.js").write_text(
              "window.VIMBISO_CFG = " + json.dumps(cfg) + ";\n"
          )
          print("supabase:", bool(cfg["supabaseUrl"]), "gemini:", bool(cfg["geminiKey"]))
          PY
          test -f dist/index.html && test -f dist/app.js
          ls -la dist

      - name: Capacitor Android
        run: |
          set -e
          npm init -y >/dev/null 2>&1 || true
          npm install @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6 --no-audit --no-fund
          printf '%s\n' '{"appId":"co.vimbiso.network","appName":"Vimbiso Network","webDir":"dist","server":{"androidScheme":"https"},"android":{"allowMixedContent":true}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          MAN=android/app/src/main/AndroidManifest.xml
          if [ -f "$MAN" ]; then
            for p in INTERNET ACCESS_NETWORK_STATE; do
              grep -q "android.permission.$p" "$MAN" || \
                sed -i "/<application/i\\    <uses-permission android:name=\"android.permission.$p\" />" "$MAN"
            done
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vimbiso-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
